[project]
name = "kundli-locations"
version = "0.1.0"
description = "Kundli App locations: place search, timezones and local time to UTC"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = ["kundli-core"]

[project.optional-dependencies]
# Only for regenerating data/locations_tz.csv (python -m kundli_locations.derive_tz); not needed at run time.
derive = ["timezonefinder==9.2.0", "timezonefinder-data==4.2026.6"]

[tool.uv.sources]
kundli-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
