[project]
name = "kundli-chart"
version = "0.1.0"
description = "Kundli App chart: South Indian rasi chart as SVG"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = ["kundli-core"]

[tool.uv.sources]
kundli-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
