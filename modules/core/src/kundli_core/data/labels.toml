# STATUS: DRAFT for the owner's review (CONVENTIONS C12). The reference files give Tamil and Sanskrit names only in
# Latin transliteration, so the Tamil-script and Devanagari forms below are the standard names, written for review.
# Correct any label here; no code change is needed.
#
# Keys are "<group>.<CODE>", e.g. "rasi.MESHA". Codes match the enums in kundli_core and the codes the placement
# engine emits. Every key must have all three languages (checked by the core tests).

