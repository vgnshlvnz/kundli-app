<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vedic Kundli Calculator</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <svg class="hero-emblem" viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="32" cy="32" r="30" />
        <circle cx="32" cy="32" r="20" />
        <circle cx="32" cy="32" r="6" />
        <g>
          <line x1="32" y1="2" x2="32" y2="12" /><line x1="32" y1="52" x2="32" y2="62" />
          <line x1="2" y1="32" x2="12" y2="32" /><line x1="52" y1="32" x2="62" y2="32" />
          <line x1="11" y1="11" x2="18" y2="18" /><line x1="46" y1="46" x2="53" y2="53" />
          <line x1="53" y1="11" x2="46" y2="18" /><line x1="18" y1="46" x2="11" y2="53" />
          <line x1="17" y1="6" x2="22" y2="15" /><line x1="47" y1="6" x2="42" y2="15" />
          <line x1="17" y1="58" x2="22" y2="49" /><line x1="47" y1="58" x2="42" y2="49" />
        </g>
      </svg>
      <div>
        <h1>Vedic Kundli Calculator</h1>
        <p>Birth chart, divisional charts, dashas and panchanga, computed in your browser</p>
      </div>
    </div>
  </header>

  <div id="app">
    <main>
      <div class="input-grid">
        <!-- Birth Form -->
        <section id="form-section" class="card">
          <form id="birth-form" class="birth-form">
            <h2>Birth Details</h2>
            <div class="form-group">
              <label for="birth-name">Name</label>
              <input type="text" id="birth-name" placeholder="Your name">
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="birth-date">Date of Birth</label>
                <input type="date" id="birth-date" required>
              </div>
              <div class="form-group">
                <label for="birth-time">Time of Birth</label>
                <input type="time" id="birth-time" step="1" required>
                <div id="utc-offset" class="utc-offset"></div>
              </div>
            </div>
            <div class="form-group" id="location-wrapper">
              <label for="birth-location">Birth Location</label>
              <input type="text" id="birth-location" placeholder="Search city..." autocomplete="off">
              <div id="location-dropdown" class="location-dropdown hidden"></div>
              <div id="location-error" class="form-error hidden"></div>
            </div>
            <div class="form-group">
              <label class="checkbox-label">
                <input type="checkbox" id="manual-toggle">
                Enter coordinates manually
              </label>
            </div>
            <div id="manual-coords-section" class="hidden">
              <div class="form-row">
                <div class="form-group">
                  <label for="manual-lat">Latitude</label>
                  <input type="number" id="manual-lat" step="0.0001" min="-90" max="90" placeholder="e.g. 13.0827">
                </div>
                <div class="form-group">
                  <label for="manual-lon">Longitude</label>
                  <input type="number" id="manual-lon" step="0.0001" min="-180" max="180" placeholder="e.g. 80.2707">
                </div>
              </div>
              <div class="form-group">
                <label for="manual-tz">Timezone</label>
                <select id="manual-tz"></select>
              </div>
            </div>
            <button type="submit" class="btn btn-primary">Calculate Kundli</button>
          </form>
        </section>

        <!-- Settings Panel -->
        <section id="settings" class="card settings-panel">
          <h2>Chart Options</h2>
          <div class="settings-row">
            <div class="setting-item">
              <label for="settings-ayanamsa">Ayanamsa</label>
              <select id="settings-ayanamsa">
                <option value="lahiri">Lahiri (Champaneri)</option>
                <option value="raman">Raman</option>
                <option value="krishnamurti">Krishnamurti</option>
              </select>
            </div>
            <div class="setting-item">
              <label for="settings-house">House System</label>
              <select id="settings-house">
                <option value="wholesign">Whole Sign</option>
                <option value="equal">Equal</option>
                <option value="placidus">Placidus</option>
              </select>
            </div>
            <div class="setting-item">
              <label for="settings-style">Chart Style</label>
              <select id="settings-style">
                <option value="basic">Basic</option>
                <option value="advanced">Advanced</option>
              </select>
            </div>
          </div>
          <p class="settings-hint">Changes apply to the current chart straight away. Advanced adds Navamsa, Vimshottari, Panchanga and KP.</p>
        </section>
      </div>

      <!-- Results Section -->
      <section id="results" class="card hidden">
        <div class="results-header">
          <h2>Your Chart</h2>
          <button type="button" id="download-pdf" class="btn btn-secondary">Download PDF</button>
        </div>
        <div id="print-summary" class="print-summary"></div>
        <div id="key-facts" class="key-facts"></div>
        <div id="tab-container" class="tab-container">
          <button class="tab-btn active" data-tab="rasi">Rasi (D1)</button>
          <button class="tab-btn" data-tab="navamsa">Navamsa (D9)</button>
          <button class="tab-btn" data-tab="planets">Planets</button>
          <button class="tab-btn" data-tab="vimshottari">Vimshottari</button>
          <button class="tab-btn" data-tab="panchanga">Panchanga</button>
          <button class="tab-btn" data-tab="kp">KP</button>
        </div>
        <div class="tab-content">
          <div id="tab-rasi"></div>
          <div id="tab-navamsa" style="display:none"></div>
          <div id="tab-planets" style="display:none"></div>
          <div id="tab-vimshottari" style="display:none"></div>
          <div id="tab-panchanga" style="display:none"></div>
          <div id="tab-kp" style="display:none"></div>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
