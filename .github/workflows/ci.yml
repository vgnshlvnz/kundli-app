name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - name: Install Python from .python-version
        run: uv python install
      - name: Install the workspace
        run: uv sync --all-packages --locked
      - name: Module dependency rule
        run: uv run python tools/check_modules.py
      - name: Tests
        run: uv run pytest
      - name: Web unit tests
        run: node --version && node --test "modules/web/tests/*.test.js"

  container:
    # The image deployed to Cloudflare Containers: its test stage runs the module
    # check and the test suite inside the runtime image (see Dockerfile).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image and run the tests in it
        run: docker build --target test .
      - name: Build the deployed stage
        run: docker build -t kundli-api .
